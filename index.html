<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <title>مهامي</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- شاشة الترحيب: إدخال الاسم -->
  <section id="welcome" class="welcome" hidden>
    <div class="welcome-card">
      <div class="app-icon">✓</div>
      <h1>أهلاً بك في مهامي</h1>
      <p class="muted">رتّب يومك بهدوء. ما اسمك؟</p>
      <form id="name-form">
        <input id="name-input" class="field" type="text" placeholder="اكتب اسمك" maxlength="30" required autocomplete="given-name" />
        <button class="btn-primary" type="submit">ابدأ</button>
      </form>
    </div>
  </section>

  <!-- التطبيق -->
  <main id="app" class="app" hidden>
    <header class="topbar">
      <div>
        <p id="today-label" class="eyebrow"></p>
        <h1 id="greeting" class="large-title"></h1>
      </div>
      <button id="edit-name" class="icon-btn" title="تغيير الاسم" aria-label="تغيير الاسم">
        <span id="avatar" class="avatar"></span>
      </button>
    </header>

    <div class="stats">
      <div class="stat"><span id="stat-today">0</span><small>اليوم</small></div>
      <div class="stat"><span id="stat-pending">0</span><small>متبقية</small></div>
      <div class="stat"><span id="stat-done">0</span><small>منجزة</small></div>
    </div>

    <div class="segmented" role="tablist">
      <button data-filter="today" class="active" role="tab">اليوم</button>
      <button data-filter="upcoming" role="tab">القادمة</button>
      <button data-filter="all" role="tab">الكل</button>
      <button data-filter="done" role="tab">المنجزة</button>
    </div>

    <section id="task-list" class="task-list" aria-live="polite"></section>

    <button id="fab" class="fab" aria-label="إضافة مهمة">+</button>
  </main>

  <!-- ورقة إضافة مهمة -->
  <div id="sheet-backdrop" class="backdrop" hidden></div>
  <form id="task-sheet" class="sheet" hidden>
    <div class="sheet-grabber"></div>
    <div class="sheet-header">
      <button type="button" id="sheet-cancel" class="link-btn">إلغاء</button>
      <h2 id="sheet-title">مهمة جديدة</h2>
      <button type="submit" class="link-btn strong">حفظ</button>
    </div>
    <div class="group">
      <input id="task-title" class="row-input" type="text" placeholder="اسم المهمة" maxlength="80" required />
      <textarea id="task-notes" class="row-input" rows="2" placeholder="ملاحظات (اختياري)"></textarea>
    </div>
    <div class="group">
      <label class="row"><span>📅 اليوم</span><input id="task-date" type="date" required /></label>
      <label class="row"><span>⏰ الوقت</span><input id="task-time" type="time" required /></label>
    </div>
    <div class="group">
      <div class="row">
        <span>الأولوية</span>
        <div class="segmented small" id="priority">
          <button type="button" data-p="low">منخفضة</button>
          <button type="button" data-p="medium" class="active">متوسطة</button>
          <button type="button" data-p="high">عالية</button>
        </div>
      </div>
    </div>
  </form>

  <script type="module" src="js/app.js"></script>
</body>
</html>
